<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
    <style>
        td,
        th {
            border: 1px solid green;
            padding: 10px;
        }

        th {
            background-color: green;
            color: white;
            border: 1px solid rgb(50, 108, 50);
        }

        table {
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: #e88585;
            color: rgb(227, 227, 227);
        }

        tr:nth-child(odd) {
            background-color: #e7e7e7;
        }
    </style>
</head>

<body>
    <table border="1">
        <caption>Tabel Mahasiswa</caption>

        <thead>
            <tr>
                <th rowspan="2">NO</th>
                <th rowspan="2">NIM</th>
                <th colspan="3">MAHASISWA</th>
            </tr>

            <tr>
                <th>NAMA</th>
                <th>PRODI</th>
                <th>ALAMAT</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>2402011001</td>
                <td>Abima Al Ghifari</td>
                <td>Teknik Informatika</td>
                <td>Gunung Medan</td>
            </tr>

            <tr>
                <td>2</td>
                <td>1402011002</td>
                <td>Adzia Sukma Erita</td>
                <td>Teknik Informatika</td>
                <td>Sikabau</td>
            </tr>

            <tr>
                <td>3</td>
                <td>2402011003</td>
                <td>Aga Silvo Yondra</td>
                <td>Teknik Informatika</td>
                <td>Blok B</td>
            </tr>
        </tbody>
        
        <tfoot>
            <tr>
                <td colspan="4">Jumlah</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
